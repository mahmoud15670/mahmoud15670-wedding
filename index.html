<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>رسايل التهنئة - تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>
    
  </head>
  <body>

    <div id="login-container" class="container-wrapper">
      <h2>تسجيل الدخول</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="email">البريد الإلكتروني:</label>
          <input type="email" id="email" required placeholder="أدخل البريد الإلكتروني" />
        </div>
        <div class="form-group">
          <label for="password">كلمة المرور:</label>
          <input type="password" id="password" required placeholder="أدخل كلمة المرور" />
        </div>
        <button type="submit" class="btn-primary">دخول</button>
        <p id="error-message"></p>
      </form>
    </div>

    <div id="app-container" class="container-wrapper hidden">
      <h1>رسايل التهنئة</h1>
      <div class="container">
        <div id="messages-container">
          <p>جاري تحميل الرسائل...</p>
        </div>
      </div>
      <button id="logout-btn" class="btn-danger" style="margin-top: 20px;">تسجيل الخروج</button>
    </div>

  </body>
</html>
